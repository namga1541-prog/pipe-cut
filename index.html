<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="광표반장님 제단계산기">
<title>광표반장님 배관 제단 계산기</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#222c36; --line:#33404d;
    --txt:#e8edf2; --sub:#9fb0bf; --accent:#2196f3; --accent2:#1565c0;
    --ok:#43a047; --warn:#fb8c00; --bad:#e53935;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.5;
    padding:env(safe-area-inset-top) 0 40px;
  }
  header{
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    padding:18px 16px; text-align:center;
    box-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  header h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.3px;}
  header p{margin:4px 0 0; font-size:12.5px; opacity:.92;}
  .wrap{max-width:760px; margin:0 auto; padding:16px;}
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
  }
  .card h2{margin:0 0 12px; font-size:15px; color:var(--accent);
    display:flex; align-items:center; gap:7px;}
  label{display:block; font-size:12.5px; color:var(--sub); margin-bottom:5px;}
  input[type=number]{
    width:100%; background:var(--panel2); border:1px solid var(--line);
    color:var(--txt); border-radius:10px; padding:11px 12px; font-size:16px;
    outline:none; transition:border-color .15s;
  }
  input[type=number]:focus{border-color:var(--accent);}
  select{
    width:100%; background:var(--panel2); border:1px solid var(--line);
    color:var(--txt); border-radius:10px; padding:11px 12px; font-size:16px;
    outline:none; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239fb0bf' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:34px;
  }
  select:focus{border-color:var(--accent);}
  .spec-badge{display:inline-block; background:var(--accent2); color:#fff;
    font-size:13px; font-weight:700; padding:3px 10px; border-radius:8px; margin-left:8px;
    vertical-align:middle;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* 절단 항목 테이블 */
  .cuts-head,.cut-row{
    display:grid; grid-template-columns:1fr 1fr 44px; gap:10px; align-items:center;
  }
  .cuts-head{font-size:11.5px; color:var(--sub); margin-bottom:6px; padding:0 2px;}
  .cut-row{margin-bottom:10px;}
  .del-btn{
    background:var(--panel2); border:1px solid var(--line); color:var(--bad);
    border-radius:10px; height:44px; font-size:20px; cursor:pointer; line-height:1;
  }
  .del-btn:active{background:#2d1414;}
  .add-btn{
    width:100%; background:transparent; border:1.5px dashed var(--line);
    color:var(--accent); border-radius:10px; padding:11px; font-size:14px;
    cursor:pointer; margin-top:2px;
  }
  .add-btn:active{background:var(--panel2);}

  .calc-btn{
    width:100%; background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#fff; border:none; border-radius:var(--radius); padding:16px;
    font-size:17px; font-weight:700; cursor:pointer; margin-top:4px;
    box-shadow:0 4px 14px rgba(33,150,243,.35);
  }
  .calc-btn:active{transform:translateY(1px);}

  /* 결과 */
  #result{display:none;}
  .summary{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:12px 8px; text-align:center;}
  .stat .v{font-size:22px; font-weight:800; line-height:1.1;}
  .stat .k{font-size:11px; color:var(--sub); margin-top:3px;}
  .stat.ok .v{color:var(--ok);} .stat.warn .v{color:var(--warn);}

  .bar-block{margin-bottom:14px;}
  .bar-title{display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; margin-bottom:5px;}
  .bar-title b{font-size:14px;}
  .bar-title .waste{color:var(--sub); font-size:12px;}
  .bar-title .waste.reuse{color:var(--ok); font-weight:600;}
  .bar{display:flex; height:42px; border-radius:9px; overflow:hidden;
    border:1px solid var(--line); background:#0a0e12;}
  .seg{display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:#fff; overflow:hidden; white-space:nowrap;
    border-right:1px solid rgba(0,0,0,.35); min-width:0;}
  .seg.scrap{background:repeating-linear-gradient(45deg,#2a333d,#2a333d 6px,#222c36 6px,#222c36 12px);
    color:var(--sub); font-weight:500;}
  .seg.endloss{background:#b71c1c; opacity:.75; border-left:1px solid rgba(0,0,0,.4);}
  .cut-list{font-size:12px; color:var(--sub); margin-top:5px; padding-left:2px;}

  .legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin:4px 0 14px; font-size:12px;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend i{width:13px; height:13px; border-radius:3px; display:inline-block;}

  .note{font-size:12px; color:var(--sub); margin-top:8px;}
  .err{background:#3a1a1a; border:1px solid var(--bad); color:#ffb3b3;
    padding:11px 13px; border-radius:10px; font-size:13px; margin-top:10px;}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .actions button{background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:11px; padding:13px; font-size:14px; cursor:pointer;}
  .actions button:active{background:var(--panel);}

  @media print{
    body{background:#fff; color:#000; padding:0;}
    header{background:#1565c0 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .card.input-card,.calc-btn,.actions{display:none !important;}
    .bar,.seg{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .card{border:1px solid #ccc; break-inside:avoid;}
    .stat{border:1px solid #ccc;}
  }
</style>
</head>
<body>
<header>
  <h1>🔧 광표반장님 배관 제단 계산기</h1>
  <p>SUS 짜투리 최소 · 본수 최소 자동 최적화</p>
</header>

<div class="wrap">

  <!-- 입력 -->
  <div class="card input-card">
    <h2>① 배관 사양</h2>
    <div class="row2">
      <div>
        <label>구경 (관경)</label>
        <select id="dia"></select>
      </div>
      <div>
        <label>스케줄 (관 두께)</label>
        <select id="sch"></select>
      </div>
    </div>
  </div>

  <div class="card input-card">
    <h2>② 원자재</h2>
    <div class="row2">
      <div>
        <label>한 본 길이 (mm)</label>
        <input type="number" id="stockLen" value="6000" min="1" inputmode="numeric">
      </div>
      <div>
        <label>보유 본수 (비우면 무제한)</label>
        <input type="number" id="stockQty" value="6" min="1" inputmode="numeric" placeholder="무제한">
      </div>
    </div>
    <div class="row2" style="margin-top:12px">
      <div>
        <label>본당 손실 · 끝단 (mm)</label>
        <input type="number" id="endLoss" value="100" min="0" inputmode="numeric">
      </div>
      <div>
        <label>절단 손실 · 톱날 (mm/조각)</label>
        <input type="number" id="kerf" value="0" min="0" inputmode="numeric">
      </div>
    </div>
    <div class="note" id="usableNote">→ 한 본당 실제 사용 가능: <b id="usableLen">5,900mm</b></div>
  </div>

  <div class="card input-card">
    <h2>③ 필요한 제단 목록</h2>
    <div class="cuts-head">
      <div>길이 (mm)</div><div>수량 (개)</div><div></div>
    </div>
    <div id="cutRows"></div>
    <button class="add-btn" id="addRow">＋ 항목 추가</button>
  </div>

  <button class="calc-btn" id="calcBtn">📐 최적 제단 계산</button>
  <div id="inputErr"></div>

  <!-- 결과 -->
  <div class="card" id="result">
    <h2>④ 제단 계획 <span class="spec-badge" id="specBadge"></span></h2>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend"></div>
    <div id="bars"></div>
    <div class="note" id="leftoverNote"></div>
    <div class="actions">
      <button id="printBtn">🖨️ 인쇄 / PDF</button>
      <button id="saveBtn">💾 입력값 저장</button>
    </div>
  </div>

</div>

<script>
/* ===== 상태 ===== */
var LS_KEY = 'pipeCutCalc.v1';
var COLORS = ['#2196f3','#43a047','#fb8c00','#ab47bc','#26c6da','#ec407a',
              '#7e57c2','#66bb6a','#ffa726','#5c6bc0','#26a69a','#d4537a'];
var DIAMETERS = ['20A','25A','32A','40A','50A','65A','80A','90A','100A','125A','150A','200A'];
var SCHEDULES = [10,20,30,40];

function fillSelects(){
  var dia = document.getElementById('dia');
  DIAMETERS.forEach(function(d){
    var o=document.createElement('option'); o.value=d; o.textContent=d; dia.appendChild(o);
  });
  dia.value='50A';
  var sch = document.getElementById('sch');
  SCHEDULES.forEach(function(s){
    var o=document.createElement('option'); o.value=s; o.textContent='Sch '+s; sch.appendChild(o);
  });
  sch.value='10';
}
function specLabel(){
  return document.getElementById('dia').value + ' · Sch ' + document.getElementById('sch').value;
}

/* ===== 절단 항목 행 ===== */
function makeRow(len, qty){
  var row = document.createElement('div');
  row.className = 'cut-row';
  var l = document.createElement('input');
  l.type='number'; l.min='1'; l.inputMode='numeric'; l.placeholder='예: 1500';
  l.className='cut-len'; if(len!=null) l.value=len;
  var q = document.createElement('input');
  q.type='number'; q.min='1'; q.inputMode='numeric'; q.placeholder='예: 6';
  q.className='cut-qty'; if(qty!=null) q.value=qty;
  var d = document.createElement('button');
  d.className='del-btn'; d.textContent='×'; d.title='삭제';
  d.onclick=function(){ row.remove(); };
  row.appendChild(l); row.appendChild(q); row.appendChild(d);
  return row;
}
function addRow(len, qty){ document.getElementById('cutRows').appendChild(makeRow(len,qty)); }

/* ===== 입력 읽기 ===== */
function readInputs(){
  var stockLen = parseInt(document.getElementById('stockLen').value,10);
  var stockQtyRaw = document.getElementById('stockQty').value.trim();
  var stockQty = stockQtyRaw==='' ? Infinity : parseInt(stockQtyRaw,10);
  var kerf = parseInt(document.getElementById('kerf').value,10) || 0;
  var endLoss = parseInt(document.getElementById('endLoss').value,10) || 0;
  var items = [];
  var rows = document.querySelectorAll('.cut-row');
  for(var i=0;i<rows.length;i++){
    var len = parseInt(rows[i].querySelector('.cut-len').value,10);
    var qty = parseInt(rows[i].querySelector('.cut-qty').value,10);
    if(len>0 && qty>0) items.push({len:len, qty:qty});
  }
  return {stockLen:stockLen, stockQty:stockQty, kerf:kerf, endLoss:endLoss, items:items};
}

/* ===== 최적화 솔버 =====
   - 각 조각은 (길이 + kerf) 만큼 소요로 보수적 모델링
   - Best-Fit Decreasing + 무작위 재시작으로 본수 최소화 → 잔재 집중(최대 단일 자투리) 최적화
*/
function packBins(pieces, cap){
  // pieces: 소요길이 배열, cap: 한 본 용량
  var bins = []; // 각 bin: {rem, items:[원래길이...]}
  for(var i=0;i<pieces.length;i++){
    var p = pieces[i];
    var best=-1, bestRem=Infinity;
    for(var b=0;b<bins.length;b++){
      var r = bins[b].rem - p.eff;
      if(r>=0 && r<bestRem){ bestRem=r; best=b; }
    }
    if(best<0){ bins.push({rem:cap, items:[]}); best=bins.length-1; }
    bins[best].rem -= p.eff;
    bins[best].items.push(p.len);
  }
  return bins;
}
function shuffle(a, seed){
  // 결정적 의사난수(재현 가능) + 인덱스 기반
  var arr = a.slice();
  var s = seed*2654435761 % 2147483647;
  function rnd(){ s = (s*16807) % 2147483647; return s/2147483647; }
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(rnd()*(i+1));
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
function solve(cfg){
  var cap = cfg.stockLen - cfg.endLoss; // 한 본당 실제 사용 가능 길이
  if(cap<=0) return {error:'본당 손실이 원자재 길이보다 크거나 같습니다.'};
  var pieces=[];
  cfg.items.forEach(function(it){
    for(var i=0;i<it.qty;i++) pieces.push({len:it.len, eff:it.len + cfg.kerf});
  });
  // 단일 조각이 사용 가능 길이보다 길면 불가
  var tooLong = pieces.filter(function(p){ return p.eff > cap; });
  if(tooLong.length) return {error:'사용 가능 길이('+cap.toLocaleString()+'mm)보다 긴 제단 항목이 있습니다: '
    + tooLong.map(function(p){return p.len+'mm';}).join(', ')};
  if(!pieces.length) return {error:'제단 목록을 입력하세요.'};

  // 길이 내림차순 기본 + 무작위 재시작
  var base = pieces.slice().sort(function(a,b){return b.eff-a.eff;});
  var best=null;
  function consider(order){
    var bins = packBins(order, cap);
    // 점수: 본수 최소 우선 → 그다음 최대 단일 자투리(재사용성)
    var maxRem=0; for(var i=0;i<bins.length;i++) if(bins[i].rem>maxRem) maxRem=bins[i].rem;
    var sc = {bins:bins, n:bins.length, maxRem:maxRem};
    if(!best || sc.n<best.n || (sc.n===best.n && sc.maxRem>best.maxRem)) best=sc;
  }
  consider(base);
  for(var k=1;k<=2500;k++) consider(shuffle(base,k));

  // 본수 제한 체크
  var overStock = (cfg.stockQty!==Infinity && best.n > cfg.stockQty);

  // 통계
  var totalNeed=0; pieces.forEach(function(p){ totalNeed+=p.len; });
  var totalStock = best.n * cfg.stockLen;            // 전체 원자재(6000 기준)
  var endLossTotal = best.n * cfg.endLoss;           // 끝단 손실 합
  var kerfTotal = cfg.kerf * pieces.length;          // 톱날 손실 합
  var cutScrap = (best.n * cap) - totalNeed - kerfTotal; // 절단 짜투리(끝단 제외)
  if(cutScrap<0) cutScrap=0;
  var totalScrap = cutScrap + endLossTotal + kerfTotal;  // 전체 버려지는 양
  var eff = totalNeed/totalStock*100;

  return {
    bins: best.bins, nBars: best.n, overStock: overStock,
    stockQty: cfg.stockQty, stockLen: cfg.stockLen, kerf: cfg.kerf, endLoss: cfg.endLoss, cap: cap,
    totalNeed: totalNeed, cutScrap: cutScrap, endLossTotal: endLossTotal, kerfTotal: kerfTotal,
    totalScrap: totalScrap, eff: eff, pieceCount: pieces.length
  };
}

/* ===== 렌더 ===== */
function colorOf(len, lenColorMap){
  if(!(len in lenColorMap)){
    lenColorMap[len] = COLORS[Object.keys(lenColorMap).length % COLORS.length];
  }
  return lenColorMap[len];
}
function render(res, cfg){
  var resBox = document.getElementById('result');
  var errBox = document.getElementById('inputErr');
  errBox.innerHTML='';
  if(res.error){
    resBox.style.display='none';
    errBox.innerHTML='<div class="err">⚠️ '+res.error+'</div>';
    return;
  }
  resBox.style.display='block';
  document.getElementById('specBadge').textContent = specLabel();

  // 요약
  var reuseThreshold = Math.min.apply(null, cfg.items.map(function(i){return i.len;}));
  var summary = document.getElementById('summary');
  summary.innerHTML =
    '<div class="stat ok"><div class="v">'+res.nBars+'</div><div class="k">필요 본수</div></div>'+
    '<div class="stat warn"><div class="v">'+res.cutScrap.toLocaleString()+'</div><div class="k">절단 짜투리 (mm)</div></div>'+
    '<div class="stat"><div class="v">'+res.eff.toFixed(1)+'%</div><div class="k">자재 효율</div></div>';

  // 색상 맵 (길이별) — 정렬해서 일관
  var lenColorMap={};
  var lens = {}; res.bins.forEach(function(bin){ bin.items.forEach(function(l){ lens[l]=1; }); });
  Object.keys(lens).map(Number).sort(function(a,b){return b-a;}).forEach(function(l){ colorOf(l,lenColorMap); });

  // 범례
  var legend = document.getElementById('legend');
  legend.innerHTML = Object.keys(lenColorMap).map(Number).sort(function(a,b){return b-a;}).map(function(l){
    return '<span><i style="background:'+lenColorMap[l]+'"></i>'+l.toLocaleString()+'mm</span>';
  }).join('') + '<span><i style="background:repeating-linear-gradient(45deg,#2a333d,#2a333d 4px,#222c36 4px,#222c36 8px)"></i>짜투리</span>'
    + (res.endLoss>0 ? '<span><i style="background:#b71c1c;opacity:.75"></i>끝단 손실</span>' : '');

  // 본별 막대
  var bars = document.getElementById('bars');
  bars.innerHTML='';
  res.bins.forEach(function(bin, idx){
    // 같은 길이끼리 모아서 표시(보기 좋게 내림차순)
    var sorted = bin.items.slice().sort(function(a,b){return b-a;});
    var scrap = bin.rem; // 남은 용량(=실제 자투리, kerf 포함 소요 후)
    var block = document.createElement('div');
    block.className='bar-block';

    var reuse = scrap >= reuseThreshold;
    var counts = {};
    sorted.forEach(function(l){ counts[l]=(counts[l]||0)+1; });
    var listTxt = Object.keys(counts).map(Number).sort(function(a,b){return b-a;}).map(function(l){
      return l.toLocaleString()+'mm × '+counts[l];
    }).join('  +  ');

    block.innerHTML =
      '<div class="bar-title"><b>'+(idx+1)+'번 본</b>'+
      '<span class="waste'+(reuse?' reuse':'')+'">짜투리 '+scrap.toLocaleString()+'mm'+(reuse?' ♻ 재사용 가능':'')+'</span></div>';

    var bar = document.createElement('div'); bar.className='bar';
    sorted.forEach(function(l){
      var seg=document.createElement('div'); seg.className='seg';
      seg.style.flex = l;
      seg.style.background = lenColorMap[l];
      seg.textContent = l;
      bar.appendChild(seg);
    });
    if(scrap>0){
      var sc=document.createElement('div'); sc.className='seg scrap';
      sc.style.flex = scrap;
      if(scrap > res.stockLen*0.06) sc.textContent = scrap;
      bar.appendChild(sc);
    }
    if(res.endLoss>0){
      var el=document.createElement('div'); el.className='seg endloss';
      el.style.flex = res.endLoss;
      el.title='끝단 손실 '+res.endLoss+'mm';
      bar.appendChild(el);
    }
    block.appendChild(bar);
    var cl=document.createElement('div'); cl.className='cut-list'; cl.textContent='✂ '+listTxt;
    block.appendChild(cl);
    bars.appendChild(block);
  });

  // 자투리 / 본수 안내
  var note = document.getElementById('leftoverNote');
  var msgs=[];
  if(res.overStock){
    msgs.push('⚠️ <b style="color:var(--bad)">보유 본수('+res.stockQty+')보다 '+(res.nBars-res.stockQty)+'본 부족</b>합니다. 자재를 추가하거나 수량을 조정하세요.');
  } else if(res.stockQty!==Infinity){
    msgs.push('보유 '+res.stockQty+'본 중 <b>'+res.nBars+'본</b> 사용 · '+(res.stockQty-res.nBars)+'본 남음(미절단).');
  }
  var br = [];
  br.push('절단 짜투리 <b>'+res.cutScrap.toLocaleString()+'mm</b>');
  if(res.endLoss>0) br.push('끝단 손실 '+res.endLossTotal.toLocaleString()+'mm ('+res.nBars+'본×'+res.endLoss+')');
  if(res.kerf>0) br.push('톱날 손실 '+res.kerfTotal.toLocaleString()+'mm ('+res.pieceCount+'조각×'+res.kerf+')');
  msgs.push('한 본 사용 가능 <b>'+res.cap.toLocaleString()+'mm</b> (6,000 − 끝단 '+res.endLoss+'). 손실 합계 = '+br.join(' + '));
  note.innerHTML = msgs.join('<br>');
}

/* ===== 사용 가능 길이 실시간 표시 ===== */
function updateUsable(){
  var s = parseInt(document.getElementById('stockLen').value,10)||0;
  var e = parseInt(document.getElementById('endLoss').value,10)||0;
  var u = s-e;
  document.getElementById('usableLen').textContent = (u>0?u.toLocaleString():0)+'mm';
}
document.getElementById('stockLen').addEventListener('input', updateUsable);
document.getElementById('endLoss').addEventListener('input', updateUsable);

/* ===== 이벤트 ===== */
document.getElementById('addRow').onclick=function(){ addRow(); };
document.getElementById('calcBtn').onclick=function(){
  var cfg = readInputs();
  if(!(cfg.stockLen>0)){
    document.getElementById('inputErr').innerHTML='<div class="err">⚠️ 원자재 길이를 입력하세요.</div>';
    document.getElementById('result').style.display='none';
    return;
  }
  var res = solve(cfg);
  render(res, cfg);
  if(!res.error) document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
};
document.getElementById('printBtn').onclick=function(){ window.print(); };
document.getElementById('saveBtn').onclick=function(){
  var cfg = readInputs();
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      stockLen:cfg.stockLen, stockQty:document.getElementById('stockQty').value,
      kerf:cfg.kerf, endLoss:cfg.endLoss, items:cfg.items,
      dia:document.getElementById('dia').value, sch:document.getElementById('sch').value
    }));
    var b=document.getElementById('saveBtn'); var t=b.textContent;
    b.textContent='✅ 저장됨'; setTimeout(function(){ b.textContent=t; },1200);
  }catch(e){ alert('저장 실패: '+e.message); }
};

/* ===== 초기화 (저장값 or 반장님 예시) ===== */
(function init(){
  fillSelects();
  var saved=null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(saved && saved.items && saved.items.length){
    if(saved.dia) document.getElementById('dia').value = saved.dia;
    if(saved.sch) document.getElementById('sch').value = saved.sch;
    document.getElementById('stockLen').value = saved.stockLen;
    document.getElementById('stockQty').value = saved.stockQty;
    document.getElementById('kerf').value = saved.kerf||0;
    document.getElementById('endLoss').value = (saved.endLoss!=null?saved.endLoss:100);
    saved.items.forEach(function(it){ addRow(it.len, it.qty); });
  }else{
    // 반장님이 주신 실제 작업으로 미리 채움
    addRow(3200,1); addRow(3100,2); addRow(1500,6); addRow(1300,5); addRow(1250,7);
  }
  updateUsable();
})();

/* ===== PWA 서비스 워커 등록 (오프라인 + 자동 최신화) ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
